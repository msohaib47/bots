services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: swingalert
      POSTGRES_PASSWORD: swingalert
      POSTGRES_DB: swingalert
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U swingalert"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://swingalert:swingalert@db:5432/swingalert
    volumes:
      - reports_data:/srv/app/reports
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  reports_data:
